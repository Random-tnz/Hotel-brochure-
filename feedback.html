<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Feedback Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        
        body {
            background-color: #480618;
            color: black;
            font-family: "Montserrat", sans-serif;
            text-align: left;
        }

        /* Headings stay centered */
        h1, h3, h4 {
            text-align: center;
            color: black;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-weight: 600;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Questions */
        p {
            text-align: left;
            color: black;
        }

        /* Text, email and password inputs */
        input[type="text"],
        input[type="email"],
        input[type="password"] {
            background-color: white;
            color: black;
            font-family: "Montserrat", sans-serif;
            border: 2px solid black;
            padding: 10px;
            border-radius: 5px;
        }

        /* Pale grey placeholders */
        input::placeholder {
            color: #d3d3d3;
        }

        /* Dropdown */
        select {
            background-color: grey;
            color: #ffcccc;
            font-family: "Montserrat", sans-serif;
            border: 2px solid black;
            padding: 10px;
            border-radius: 5px;
        }

        /* Dropdown options */
        select option {
            background-color: grey;
            color: #ffcccc;
        }

        /* Submit button */
        input[type="submit"] {
            background-color: black;
            color: #ffcccc;
            font-family: "Montserrat", sans-serif;
            font-weight: 600;
            border: 2px solid grey;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Home page link */
        a {
            color: black;
        }
    </style>
</head>

<body>

    <h1>Evergreen Roses Hotel Feedback Form</h1>

    <form>

        <input type="text" placeholder="Full name">
        <br><br><br>

        <input type="email" placeholder="Email">
        <br><br><br>

        <input type="password" placeholder="My password">

        <h3>Answer the following questions</h3>

        <p>Select your gender</p>

        <input type="radio" id="male" name="gender">
        <label for="male">Male</label>

        <br>

        <input type="radio" id="female" name="gender">
        <label for="female">Female</label>

        <h3>Please rate our service</h3>

        <select name="Feedback">
            <option value="5">Excellent</option>
            <option value="4">Good</option>
            <option value="3">Average</option>
            <option value="2">Poor</option>
            <option value="1">Very Bad</option>
        </select>

        <br><br><br>

        <input type="text" placeholder="Thoughts (Optional)">

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <a href="Hotel brochure.html">Home page</a>

</body>
</html>
